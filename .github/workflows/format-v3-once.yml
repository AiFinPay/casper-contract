name: format-v3-once

on:
  push:
    branches:
      - release/settlement-v3-production-rc

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/settlement-v3-production-rc
      - name: Install pinned formatter
        run: rustup toolchain install nightly-2025-02-04 --profile minimal --component rustfmt
      - name: Format and constrain diff
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2025-02-04 fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "src/main.rs" || { echo "unexpected rustfmt diff: $changed"; exit 1; }
          cargo +nightly-2025-02-04 fmt --all -- --check
      - name: Commit format-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "style(casper): rustfmt v3 economics wiring"
          git push origin HEAD:release/settlement-v3-production-rc
