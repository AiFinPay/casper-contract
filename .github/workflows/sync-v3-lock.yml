name: sync-v3-lock-once

on:
  push:
    branches:
      - release/settlement-v3-production-rc

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/settlement-v3-production-rc
      - name: Update local package metadata only
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check >/tmp/cargo-check.log 2>&1 || { cat /tmp/cargo-check.log; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          before = Path('/tmp/Cargo.lock.before').read_text()
          after = Path('Cargo.lock').read_text()
          expected = before.replace('name = "aifinpay-casper"\nversion = "2.0.0"', 'name = "aifinpay-casper"\nversion = "3.0.0-rc.1"', 1)
          if before == expected:
              raise SystemExit('expected v2 root package stanza was not present')
          if after != expected:
              Path('/tmp/Cargo.lock.actual').write_text(after)
              raise SystemExit('Cargo changed more than the single local package version; refusing automatic lock update')
          PY
      - name: Commit deterministic lock update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --exit-code && exit 0
          git commit -m "chore(casper): sync Cargo.lock for v3 RC"
          git push origin HEAD:release/settlement-v3-production-rc
