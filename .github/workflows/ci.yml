name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Contract · build (Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build Wasm (release)
        run: cargo build --release

      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: aifinpay-casper-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: warn

  quality:
    name: Contract · fmt · clippy (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with components
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Format check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  demo:
    name: Demo / SDK · lint · format (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prettier format check
        run: npx --yes prettier --check "**/*.{js,mjs,json,md}"
        continue-on-error: true

      - name: ESLint
        run: npx --yes eslint . --ext .js,.mjs
        continue-on-error: true
