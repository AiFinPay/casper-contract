name: 🐛 Bug Report
description: Report a problem with the contract, demo, SDK, or MCP server
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run '...'
        2. Call entry point '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Smart contract (src/)
        - Demo / agent flow (demo/)
        - MCP server (casper-mcp.mjs)
        - Dashboard
        - Docs / CI
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network
      placeholder: casper-test
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / tx hashes
      render: shell
