[package]
name = "aifinpay-casper"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "aifinpay_casper"
path = "src/main.rs"
bench = false
doctest = false
test = false

[features]
default = []

[workspace]
members = ["session"]
resolver = "2"

[dependencies]
casper-contract = "5.1.1"
casper-types = "6.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
