[package]
name = "aifinpay-casper"
version = "3.0.0-rc.1"
edition = "2021"

[[bin]]
name = "aifinpay_casper"
path = "src/main.rs"
bench = false
doctest = false
test = false

[features]
default = []

[dependencies]
casper-types = "6.1.0"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
casper-contract = "5.1.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
